<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
	<header class="flexbox center">
		<h1>Hello, world!</h1>
	</header>
	<main>
		<!--new task configuration-->
		<div class="flexbox">
			<button id="taskAdder">ADD NEW TASK</button>
			<input>
		</div>
		<!--new task container-->
		<div id="taskContainer">
			<!--new task-->
			<div class="task">
				<!--task info container-->
				<div class="information">
					<h1>Placeholder</h1>
					<!--task description-->
					<div class="flexbox description">
						<h2>Medium</h2>
						<h2>300</h2>
					</div>
				</div>
				<!--finishes the task-->
				<button>END TASK</button>
			</div>
		</div>
	</main>
<script src="scripts.js">
</script>
</body>
</html>
