<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Logs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
	<header class="flexbox center">
		<h1>Task Logs</h1>
		<div>
			<div class="flexbox description">
				<h1>Level:</h1>
				<h1 id="playerLevel">0</h1>
			</div>
			<progress id="levelBar" value="0" max="100">
		</div>
	</header>
	<main>
		<!--new task configuration-->
		<div class="flexbox configuration">
			<h1>New Task</h1>
			<input id="taskNameTXT"placeholder="Task Name" autocomplete="off" type="text">
			<select id="taskDiffTXT">
				<option value="" selected disabled>Task Difficulty</option>
				<option value="Easy" data-points="100">Easy</option>
				<option value="Medium" data-points="200">Medium</option>
				<option value="Hard" data-points="300">Hard</option>
			</select>
			<button id="taskAdder">ADD NEW TASK</button>
		</div>
		<!--new task container-->
		<div id="taskContainer">
			<!--
			<div class="task">
				<div class="information">
					<h1>Placeholder</h1>
					<div class="flexbox description">
						<h2>Medium</h2>
						<h2>300</h2>
					</div>
				</div>
				<button class="taskEnder">END TASK</button>
			</div>
			-->
		</div>
	</main>
<script src="scripts.js">
</script>
</body>
</html>
